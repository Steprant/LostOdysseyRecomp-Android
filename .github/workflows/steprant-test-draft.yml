name: Steprant test draft

# Copies a finished Android APK workflow artifact from steprant/v2.0-dev (1.9
# test builds), steprant/v2.0 (2.0) or steprant/v2.0.2 (2.0.2 stable base)
# into a DRAFT release
# v<version>-steprant.<YYYYMMDD>-<short_name>. It never publishes the release
# and never marks it latest; the public 1.8 release is untouched.
# Run by hand, or by pushing .github/steprant-test-draft.json
# ({"run_id": "...", "short_name": "..."}) to steprant/v2.0-dev.
on:
  push:
    branches: ['steprant/v2.0-dev', 'steprant/v2.0.2', 'steprant/v2.0.3', 'steprant/v2.0.4', 'steprant/v2.0.5', 'steprant/v2.0.6', 'steprant/v2.0.7', 'steprant/v2.0.8', 'steprant/v2.1', 'steprant/v2.1.1']
    paths: ['.github/steprant-test-draft.json']
  workflow_dispatch:
    inputs:
      run_id:
        description: Android APK workflow run whose artifact to attach
        required: false
        type: string
      short_name:
        description: Short build name used in the APK file name (letters, digits, hyphen)
        required: false
        type: string
permissions:
  contents: write
  actions: read
jobs:
  draft:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/steprant-test-draft.json
          sparse-checkout-cone-mode: false
      - name: Select the APK run
        env:
          INPUT_RUN: ${{ inputs.run_id }}
          INPUT_NAME: ${{ inputs.short_name }}
        run: |
          set -euo pipefail
          run="$INPUT_RUN"; name="$INPUT_NAME"
          if [[ -z "$run" ]]; then
            run=$(python3 -c 'import json;print(json.load(open(".github/steprant-test-draft.json"))["run_id"])')
            name=$(python3 -c 'import json;print(json.load(open(".github/steprant-test-draft.json"))["short_name"])')
          fi
          [[ "$run" =~ ^[0-9]+$ ]] || { echo "::error::invalid run_id"; exit 1; }
          echo "RUN_ID=$run" >> "$GITHUB_ENV"
          echo "SHORT_NAME=$name" >> "$GITHUB_ENV"
      - name: Wait for the APK run
        timeout-minutes: 240
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHORT_NAME" =~ ^[A-Za-z0-9-]{1,40}$ ]] || { echo "::error::invalid short_name"; exit 1; }
          while true; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -q '.status + " " + (.conclusion // "")')
            case "$state" in
              "completed success") break ;;
              completed*) echo "::error::APK run $RUN_ID finished: $state"; exit 1 ;;
            esac
            sleep 60
          done
          branch=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -q .head_branch)
          case "$branch" in
            steprant/v2.0-dev) echo "VERSION=1.9" >> "$GITHUB_ENV" ;;
            steprant/v2.0) echo "VERSION=2.0" >> "$GITHUB_ENV" ;;
            steprant/v2.0.2) echo "VERSION=2.0.2" >> "$GITHUB_ENV" ;;
            steprant/v2.0.3) echo "VERSION=2.0.3" >> "$GITHUB_ENV" ;;
            steprant/v2.0.4) echo "VERSION=2.0.4" >> "$GITHUB_ENV" ;;
            steprant/v2.0.5) echo "VERSION=2.0.5" >> "$GITHUB_ENV" ;;
            steprant/v2.0.6) echo "VERSION=2.0.6" >> "$GITHUB_ENV" ;;
            steprant/v2.0.7) echo "VERSION=2.0.7" >> "$GITHUB_ENV" ;;
            steprant/v2.0.8) echo "VERSION=2.0.8" >> "$GITHUB_ENV" ;;
            steprant/v2.1) echo "VERSION=2.1" >> "$GITHUB_ENV" ;;
            steprant/v2.1.1) echo "VERSION=2.1.1" >> "$GITHUB_ENV" ;;
            *) echo "::error::run $RUN_ID built $branch, not a Steprant 2.0 branch"; exit 1 ;;
          esac
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: LostOdysseyRecomp-android-arm64
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: out/apk
      - name: Create or update the draft test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -q .created_at | cut -c1-10 | tr -d -)
          commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -q .head_sha)
          src="out/apk/LostOdyssey-Steprant-v$VERSION.apk"
          apk="out/apk/LostOdyssey-Steprant-v$VERSION-$SHORT_NAME-$day.apk"
          mv "$src" "$apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "SHA-256 $sum"
          notes=out/notes.md
          {
            echo "Steprant Android $VERSION build (draft, not published). Branch $BRANCH."
            echo
            printf -- '- `%s`: SHA-256 `%s`, commit `%s`, APK run %s\n' "$(basename "$apk")" "$sum" "$commit" "$RUN_ID"
          } > "$notes"
          # A build SHA may no longer be a branch head by the time its APK
          # finishes. GITHUB_TOKEN cannot create a release for such a SHA
          # when workflow files differ. android-apk.yml preserves a ref at
          # the start of each build, with no extra token or repository-wide grant.
          pin="steprant/build-$VERSION-$RUN_ID"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$pin" -q .object.sha)
          [[ "$actual" == "$commit" ]] || { echo "::error::Build ref does not match APK source"; exit 1; }
          tag="v$VERSION-steprant.$day-$SHORT_NAME"
          title="Lost Odyssey Steprant Android $VERSION ($day, $SHORT_NAME, draft)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q ".[] | select(.tag_name == \"$tag\" or .name == \"$title\") | .id" | head -n 1)
          if [[ -n "$id" ]]; then
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q .draft)" == true ]] \
              || { echo "::error::Refusing to modify a published release"; exit 1; }
            target=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q .target_commitish)
            [[ "$target" == "$commit" || "$target" == "$pin" ]] \
              || { echo "::error::Draft belongs to another build; choose another short_name"; exit 1; }
            digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
              -q ".[] | select(.name == \"$(basename "$apk")\") | .digest")
            if [[ -n "$digest" ]]; then
              [[ "$digest" == "sha256:$sum" ]] \
                || { echo "::error::Existing draft APK has a different digest"; exit 1; }
              echo "Verified APK is already attached; preserving it."
            else
              stored_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q .tag_name)
              gh release upload "$stored_tag" "$apk" -R "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" "$apk" --draft --target "$pin" \
              --title "$title" --notes-file "$notes" -R "$GITHUB_REPOSITORY"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q ".[] | select(.draft and .name == \"$title\") | {draft, name, assets: [.assets[] | {name, digest}]}"
