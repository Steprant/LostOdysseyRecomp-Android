name: Android APK

# Builds, lints and tests the arm64 development APK with the same host code
# generation and Android build script as the release workflow. Dependency
# caches are shared with release builds; a green run is packaging validation.
on:
  workflow_dispatch:
    inputs:
      steprant_version:
        description: 'Version override for steprant/android-build (e.g. 2.0.5)'
        type: string
        default: ''
      pgo:
        description: 'Profile-guided build (SR4 C-4): off, generate (instrumented APK) or use (profile from build-inputs)'
        type: choice
        options: ['off', 'generate', 'use']
        default: 'off'
      pgo_ref:
        description: 'Build-inputs commit with pgo/lostodyssey.profdata (empty: its default branch)'
        type: string
        default: ''
  push:
    branches: ['**']
    paths:
      - .github/workflows/android-apk.yml
      - packaging/android/**
      - thirdparty/libadrenotools/**
      - thirdparty/signalsmith*/**
      - LostOdysseyRecomp/apu/**
      - tools/android/**
permissions:
  contents: read
jobs:
  identity:
    name: Select the Steprant build identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      pin: ${{ steps.version.outputs.pin }}
    steps:
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/steprant/android-build'
        with:
          sparse-checkout: packaging/android/steprant-version.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.steprant_version }}
        run: |
          set -euo pipefail
          pin=false
          case "$GITHUB_REF_NAME" in
            integration/v1.1.0-steprant-all) version=1.5 ;;
            integration/v1.6-candidate-*) version=1.6 ;;
            integration/v1.7-optimization-*) version=1.7 ;;
            steprant/v1.8) version=1.8 ;;
            steprant/v2.0-dev) version=1.9; pin=true ;;
            steprant/v2.0|steprant/v2.0.[2-5]) version=${GITHUB_REF_NAME#steprant/v}; pin=true ;;
            steprant/android-build)
              version=${VERSION_OVERRIDE:-$(<packaging/android/steprant-version.txt)}
              if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]{0,3})$ ]]; then
                echo '::error::Expected a three-part Steprant version such as 2.0.5'
                exit 1
              fi
              pin=true
              ;;
            *) version= ;;
          esac
          {
            echo "version=$version"
            echo "pin=$pin"
          } >> "$GITHUB_OUTPUT"

  pin-test-build:
    name: Preserve Steprant test build commit
    needs: identity
    if: needs.identity.outputs.pin == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - name: Pin this build before the development branch advances
        run: |
          set -euo pipefail
          pin="steprant/build-$VERSION-$GITHUB_RUN_ID"
          if actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$pin" -q .object.sha 2>ref-error.txt); then
            [[ "$actual" == "$GITHUB_SHA" ]] || { echo "::error::Build ref points to another commit"; exit 1; }
          else
            grep -q 'HTTP 404' ref-error.txt || { cat ref-error.txt >&2; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$pin" -f sha="$GITHUB_SHA" --silent
          fi
  apk:
    name: Android arm64 APK
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      LO_BUILD_JOBS: 4
      CCACHE_MAXSIZE: 2G
      STEPRANT_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select authorized private build input
        id: build-input
        env:
          LO_BUILD_XEX_URL: ${{ secrets.LO_BUILD_XEX_URL }}
          LO_BUILD_INPUT_KEY: ${{ secrets.LO_BUILD_INPUT_KEY }}
        run: |
          if [[ -n "$LO_BUILD_XEX_URL" ]]; then
            echo 'source=url' >> "$GITHUB_OUTPUT"
          elif [[ -n "$LO_BUILD_INPUT_KEY" ]]; then
            echo 'source=repository' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Missing authorized Disc 1 default.xex. Set LO_BUILD_XEX_URL to a private HTTPS URL, or LO_BUILD_INPUT_KEY for the configured private build-input repository. No game code or APK has been built.'
            exit 1
          fi
      - name: Configure the preinstalled host toolchain
        run: |
          # The Ubuntu 24.04 runner already has Clang 18, GCC 13, CMake and JDK 17.
          gcc_dir=$(dirname "$(g++-13 -print-libgcc-file-name)")
          {
            echo 'CC=clang-18'
            echo 'CXX=clang++-18'
            echo "CFLAGS=--gcc-install-dir=$gcc_dir"
            echo "CXXFLAGS=--gcc-install-dir=$gcc_dir"
            echo 'LDFLAGS=-fuse-ld=lld'
            echo "JAVA_HOME=${JAVA_HOME_17_X64:?The runner image must include JDK 17}"
          } >> "$GITHUB_ENV"
          echo '/usr/lib/llvm-18/bin' >> "$GITHUB_PATH"
          clang++-18 --version
      - name: Set up ccache
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null; then
            exit 0
          fi
          version=4.12.3
          asset="ccache-$version-linux-x86_64"
          cache_tools="$RUNNER_TEMP/lo-cache-tools"
          mkdir -p "$cache_tools"
          cd "$cache_tools"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 45 \
            "https://github.com/ccache/ccache/releases/download/v$version/$asset.tar.xz" \
            --output "$asset.tar.xz"
          printf '%s  %s\n' 'a99aa455873c978f6905f07e3176cfdf48bb610990c23ce0e1b718da0f38faa7' "$asset.tar.xz" |
            sha256sum --check
          tar -xJf "$asset.tar.xz"
          "$cache_tools/$asset/ccache" --version
          echo "$cache_tools/$asset" >> "$GITHUB_PATH"
      - name: Configure Android cache directories
        run: echo "LO_ANDROID_CI_CACHE=$RUNNER_TEMP/lo-android-ci" >> "$GITHUB_ENV"
      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.LO_ANDROID_CI_CACHE }}/android-sdk
          key: android-sdk-${{ runner.os }}-cmdline11076708-api35-build35-ndk28.2.13676358-cmake3.22.1-v1
      - name: Restore Android DXC library
        id: android-dxc
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LO_ANDROID_CI_CACHE }}/android-dxc/artifacts
          key: android-dxc-bin-${{ runner.os }}-ndk28.2.13676358-${{ hashFiles('tools/android/build-dxc.sh') }}
      - name: Restore legacy Android DXC cache
        id: legacy-dxc
        if: steps.android-dxc.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LO_ANDROID_CI_CACHE }}/android-dxc
          key: android-dxc-${{ runner.os }}-ndk28.2.13676358-${{ hashFiles('tools/android/build-dxc.sh', 'tools/android/ci_build.sh') }}
          restore-keys: android-dxc-${{ runner.os }}-ndk28.2.13676358-
      - name: Keep the legacy DXC library for verification
        if: steps.legacy-dxc.outputs.cache-matched-key != ''
        run: rm -rf -- "$LO_ANDROID_CI_CACHE/android-dxc/source" "$LO_ANDROID_CI_CACHE/android-dxc/build-android-cmake322"
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LO_ANDROID_CI_CACHE }}/gradle/caches
            ${{ env.LO_ANDROID_CI_CACHE }}/gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('packaging/android/**/*.gradle', 'packaging/android/**/*.gradle.kts', 'packaging/android/gradle.properties', 'packaging/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Cache Android compiler objects
        uses: actions/cache@v4
        with:
          path: ${{ env.LO_ANDROID_CI_CACHE }}/ccache
          key: android-ccache-v2-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-${{ inputs.pgo || 'off' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: android-ccache-v2-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-${{ inputs.pgo || 'off' }}-
      - name: Retrieve private build input
        if: steps.build-input.outputs.source == 'repository'
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          repository: ${{ vars.LO_BUILD_INPUT_REPOSITORY || 'freefrank/LostOdysseyRecomp-build-inputs' }}
          ref: ${{ vars.LO_BUILD_INPUT_REF || '2ba529b72c68ae2ee01903d24f7eac55cbb900df' }}
          path: out/build-input
          sparse-checkout: |
            /default.xex
            /android/libdxcompiler.so
            /android/debug.keystore
            /pgo/lostodyssey.profdata
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Retrieve the PGO profile
        # SR4 C-4: the merged profile lives next to the private inputs; it
        # moves faster than their pinned commit, so it has its own checkout.
        if: steps.build-input.outputs.source == 'repository' && inputs.pgo == 'use'
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          repository: ${{ vars.LO_BUILD_INPUT_REPOSITORY || 'freefrank/LostOdysseyRecomp-build-inputs' }}
          ref: ${{ inputs.pgo_ref }}
          path: out/build-input-pgo
          sparse-checkout: |
            /pgo/lostodyssey.profdata
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify private build input
        env:
          LO_BUILD_XEX_PATH: ${{ steps.build-input.outputs.source == 'repository' && 'out/build-input/default.xex' || '' }}
          LO_BUILD_XEX_URL: ${{ secrets.LO_BUILD_XEX_URL }}
        run: python tools/release/fetch_build_input.py
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Generate game code
        run: |
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build the APK
        id: build-apk
        env:
          RELEASE_TAG: ${{ env.STEPRANT_VERSION && format('v{0}', env.STEPRANT_VERSION) || '' }}
          ORG_GRADLE_PROJECT_loApplicationId: ${{ env.STEPRANT_VERSION && 'io.github.freefrank.lostodyssey.steprant' || 'io.github.freefrank.lostodyssey' }}
          ORG_GRADLE_PROJECT_loAppLabel: ${{ env.STEPRANT_VERSION && 'Lost Odyssey Steprant' || 'Lost Odyssey Recomp' }}
          ORG_GRADLE_PROJECT_loAppIcon: ${{ env.STEPRANT_VERSION && '@mipmap/ic_launcher_steprant' || '@mipmap/ic_launcher' }}
          LO_STEPRANT_VERSION: ${{ env.STEPRANT_VERSION }}
          LO_STEPRANT_DEVELOPER_PAGE: '0'
          LO_PGO: ${{ inputs.pgo || 'off' }}
        run: bash tools/android/ci_build.sh
      - name: Save the verified Android DXC library
        if: ${{ !cancelled() && steps.build-apk.outputs.dxc_ready == 'true' && steps.android-dxc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LO_ANDROID_CI_CACHE }}/android-dxc/artifacts
          key: ${{ steps.android-dxc.outputs.cache-primary-key }}
      - name: Verify and name the integrated APK
        if: env.STEPRANT_VERSION != ''
        env:
          VERSION: ${{ env.STEPRANT_VERSION }}
        run: |
          set -euo pipefail
          apk="out/apk/LostOdysseyRecomp-android-arm64-v$VERSION.apk"
          "$LO_ANDROID_CI_CACHE/android-sdk/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$LO_ANDROID_CI_CACHE/android-sdk/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          python tools/android/verify-apk.py "$apk"
          "$LO_ANDROID_CI_CACHE/android-sdk/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='$VERSION'"
          # Steprant 1.5 was signed with this certificate; an update signed
          # with another key does not install over it.
          expected=ecaadcdc715ff7e4aeaaf265ec11f1854d4039175dbc7e53fd4f86fd03af6f3f
          actual=$("$LO_ANDROID_CI_CACHE/android-sdk/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          echo "Signing certificate SHA-256: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::warning::Not signed with the Steprant 1.5 certificate ($expected); this APK will not install over 1.5. Add the fork's debug keystore to the build-input repository as android/debug.keystore."
          fi
          mv "$apk" "out/apk/LostOdyssey-Steprant-v$VERSION.apk"
          sha256sum out/apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LostOdysseyRecomp-android-arm64
          path: out/apk/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            packaging/android/runtime/build/reports/**
            packaging/android/runtime/build/test-results/**
          retention-days: 7
