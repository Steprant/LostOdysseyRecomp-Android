name: Steprant release

# Copies a finished Android APK workflow artifact into the Steprant 1.8
# release and publishes it, with docs/notes/steprant-1.8-release.md as its
# notes and the APK's SHA-256 appended. Run by hand (workflow_dispatch) with
# the APK run id; an existing release keeps its tag and gets the new asset.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Android APK workflow run whose artifact to attach
        required: true
        type: string
permissions:
  contents: write
  actions: read
env:
  RUN_ID: ${{ inputs.run_id }}
  TAG: v1.8-steprant.20261108
  TITLE: Lost Odyssey Steprant Android 1.8
jobs:
  draft:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the APK run
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while true; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -q '.status + " " + (.conclusion // "")')
            case "$state" in
              "completed success") break ;;
              completed*) echo "::error::APK run $RUN_ID finished: $state"; exit 1 ;;
            esac
            sleep 60
          done
      - uses: actions/download-artifact@v4
        with:
          name: LostOdysseyRecomp-android-arm64
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: out/apk
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src=out/apk/LostOdyssey-Steprant-v1.8.apk
          apk=out/apk/LostOdyssey-Steprant-v1.8-20261108.apk
          mv "$src" "$apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "SHA-256 $sum"
          commit=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -q .head_sha)
          notes=out/notes.md
          cp docs/notes/steprant-1.8-release.md "$notes"
          printf '\n**APK SHA-256:** `%s` (`%s`, built from commit `%s`)\n' "$sum" "$(basename "$apk")" "$commit" >> "$notes"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file "$notes" --draft=false --latest -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$apk" --target "$commit" --title "$TITLE" \
              --notes-file "$notes" --latest -R "$GITHUB_REPOSITORY"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" -q ".[] | select(.tag_name == \"$TAG\") | {draft, html_url}"
