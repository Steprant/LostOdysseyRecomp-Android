name: Steprant release

# Publishes a Steprant draft release made by steprant-test-draft.yml: checks
# that the draft exists and that its APK digest matches the expected SHA-256,
# then sets the title and the notes file from the repository, publishes it
# and marks it latest. Run by hand (workflow_dispatch); a published release is
# only updated (title and notes), never re-created.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release (v<version>-steprant.<YYYYMMDD>-<name>)
        required: true
        type: string
      title:
        description: Release title
        required: true
        type: string
      notes:
        description: Notes file in the repository
        required: true
        type: string
      apk_sha256:
        description: Expected SHA-256 of the attached APK
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.notes }}
          sparse-checkout-cone-mode: false
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          SUM: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9.]+-steprant\.[0-9]{8}-[A-Za-z0-9-]+$ ]] || { echo "::error::invalid tag"; exit 1; }
          [[ "$SUM" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid SHA-256"; exit 1; }
          [[ -f "$NOTES" ]] || { echo "::error::notes file missing"; exit 1; }
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          [[ -n "$id" ]] || { echo "::error::no release with tag $TAG"; exit 1; }
          digests=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" -q '.[] | select(.name | endswith(".apk")) | .digest')
          [[ "$digests" == "sha256:$SUM" ]] || { echo "::error::APK digest $digests does not match"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -f name="$TITLE" -F body=@"$NOTES" -F draft=false -f make_latest=true \
            -q '{draft, prerelease, name, tag_name, html_url}'
