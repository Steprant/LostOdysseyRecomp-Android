# Steprant 2.2: what tools/ppc_register_check.py must know beyond the generated
# code, for the register promotion (non_argument_as_local/non_volatile_as_local).
# Used by `analyse` (to write registers_in_context.toml) and by `check` in CI.

# Host overrides that change memory and r3 only (patches/crt_native.cpp:
# memcpy, memset). The check fails if a caller reads any other volatile
# register after them (the generated versions also change r0, r4-r12, ctr,
# cr0).
native = ["sub_82B7A0B0", "sub_82B7BC40"]

# Functions whose own register reads do not count:
# - sub_82B7E504, the stack probe: a host no-op (patches/crt_native.cpp);
# - sub_82DF34A0, the guest setjmp: every call to it is the native setjmp.
replaced = ["sub_82B7E504", "sub_82DF34A0"]

# Functions that store the caller's registers to a save area: their reads at
# the entry are saves, not uses. sub_83111958 and sub_83111CA0 are the VMX
# register-file swaps of the movie decoder: they store v32-v127 to [r4] and
# load v64-v72 (sub_83111CA0: all of v32-v127) from [r3]. The decoder's
# routines, called through pointers, read v64, v65, v69 and v72 without
# setting them. The first 2.2 listed the two under `replaced`, so they kept
# their registers as locals, their loads never reached the routines and the
# movies came out as green and magenta blocks (17/11 13:17 and 13:27). They
# now keep their registers in ctx (they write callee-saved registers for
# their caller), and the pointer rule below follows v64-v127.
saves = ["sub_83111958", "sub_83111CA0"]

# Registers the function-pointer rule follows (a range like "v64-v127" is
# fine). A function reached only through pointers that reads one of these
# from its caller makes the code that really wrote it, at every indirect
# call site, keep its registers in ctx. Left out: the other entry reads of
# indirect-only functions (r11, r24, r30 and f26-f30 in 2.2), all
# on paths that do not run: the analysis counts them, the profile never
# reaches them, and 2.2 ran them as locals through whole sessions without a
# fault. The check prints them on every build.
pointer_registers = ["v64-v127"]

# Callees that leave these volatile registers unchanged: the stack probe's
# callers read r12 (minus the frame size) after the call.
preserves = ["sub_82B7E504:r12"]

# Host overrides that read registers of one caller, chosen by return
# address: CALLER:CALLEE:registers. CALLER keeps them in ctx.
site_reads = [
    "sub_82AD6088:sub_828F7840:r30,r31",            # gpu/cinematic_bars.cpp (lr 0x82AD616C)
    "sub_823CE960:sub_823CF390:r28,r29,r30,r31",    # patches/occlusion_history.cpp via cpu/poll_wait.cpp
    "sub_8238ACC8:sub_8238AE08:f31",                # patches/battle_script_timer.cpp (lr 0x8238AD64)
    "sub_8237D258:sub_828212E0:r31",                # debug/asset_failure.cpp (lr 0x8237D308)
]
